name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      UNSUBSCRIBE_SECRET: ci-only-secret
      APP_PASSWORD: ci-only-password
      UNSUBSCRIBE_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run db:migrate
      # The phase 1 acceptance criteria: idempotent import, erasure that keeps
      # the suppression, tokens that only verify under our own secret.
      - run: npm run test:acceptance
      - run: npm run build
